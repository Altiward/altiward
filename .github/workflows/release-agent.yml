name: Release agent

# Signs, notarizes and publishes the agent package when an agent-v* tag is pushed.
# The artifact also holds the release notes from CHANGELOG.md and SHA256SUMS,
# signed keyless with cosign. The last job publishes the files on GitHub Releases
# (docs/releasing.md). Signing material lives only in repository secrets:
#   DEVELOPER_ID_APPLICATION_P12, DEVELOPER_ID_APPLICATION_PASSWORD  (base64 .p12)
#   DEVELOPER_ID_INSTALLER_P12,  DEVELOPER_ID_INSTALLER_PASSWORD     (base64 .p12)
#   NOTARY_API_KEY_P8 (base64 .p8), NOTARY_KEY_ID, NOTARY_ISSUER       (App Store Connect API key)

on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: read
  id-token: write # keyless signing of SHA256SUMS

jobs:
  package:
    runs-on: macos-latest
    environment: release # a maintainer approves before anything is signed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check the tag matches the agent version
        run: |
          want="agent-v$(sed -n 's/.*public static let current = "\(.*\)".*/\1/p' agent/Sources/AltiwardCore/DeviceIdentity.swift)"
          test "$GITHUB_REF_NAME" = "$want" || { echo "tag $GITHUB_REF_NAME but AgentVersion.current gives $want"; exit 1; }

      # Checked before the slow signing steps. Kept outside the package folder, which the
      # build clears, and copied in after it.
      - name: Release notes (refuses a version without a dated CHANGELOG section)
        run: scripts/release-notes.sh agent "${GITHUB_REF_NAME#agent-v}" > "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Import signing identities into a temporary keychain
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          APP_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_PASSWORD }}
          NOTARY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$APP_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$INSTALLER_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          rm "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          echo "$NOTARY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          APP_IDENTITY: Developer ID Application
          INSTALLER_IDENTITY: Developer ID Installer
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          OUT: ${{ runner.temp }}/package
        run: agent/packaging/build.sh

      - name: Verify the release
        run: RELEASE=1 agent/packaging/verify.sh "$RUNNER_TEMP/package"

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the checksums and check the signature
        working-directory: ${{ runner.temp }}/package
        run: |
          cp "$RUNNER_TEMP/RELEASE_NOTES.md" .
          shasum -a 256 -- *.pkg corp.sap.privileges.plist RELEASE_NOTES.md > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-agent.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: altiward-agent-${{ github.ref_name }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/package/*.pkg
            ${{ runner.temp }}/package/corp.sap.privileges.plist
            ${{ runner.temp }}/package/RELEASE_NOTES.md
            ${{ runner.temp }}/package/SHA256SUMS
            ${{ runner.temp }}/package/SHA256SUMS.sigstore.json

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # Publishes the signed files. The only job that can write to the repository.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: altiward-agent-${{ github.ref_name }}
          path: files

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The pkg, the example plist, RELEASE_NOTES.md, SHA256SUMS and its sigstore bundle.
          gh release create "$TAG" files/* \
            --verify-tag --title "$TAG" --notes-file files/RELEASE_NOTES.md
