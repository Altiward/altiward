name: Scorecard

# Runs OpenSSF Scorecard on main each push and weekly, and publishes the result to
# scorecard.dev for the README badge; the findings also go to the Security tab. The
# Scorecard API accepts published results only from a workflow of this shape: no
# workflow-level env, defaults or write permissions, and only its approved actions in the
# job (https://github.com/ossf/scorecard-action#workflow-restrictions).

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6" # Saturdays at 01:30 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload to code scanning
      id-token: write # publish_results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
