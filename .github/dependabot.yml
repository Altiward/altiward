version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /integrations
    schedule:
      interval: weekly
    groups:
      go-integrations-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    groups:
      console-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /deploy/caddy
    schedule:
      interval: weekly
    groups:
      proxy-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/caddy
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
