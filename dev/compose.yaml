# Local development dependencies. `make db` starts Postgres; `make test-db` runs the
# backend store tests against it.
name: altiward

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: altiward
      POSTGRES_PASSWORD: altiward
      POSTGRES_DB: altiward
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altiward"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
