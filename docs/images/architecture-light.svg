<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="title desc">
  <title id="title">How Altiward fits together</title>
  <desc id="desc">On each Mac, SAP Privileges grants admin rights and runs Altiward's hook on each change. The hook runs as the logged-in user, so it is untrusted, and it passes what it claims to the Altiward agent over XPC. The agent runs as root, checks each claim, reads the real admin group, removes rights when told to, and queues events until they are sent. It sends signed events to your server over HTTPS on port 443 and picks up revoke commands from it. On your server, Altiward (the API and web console, altiward-api) checks each Mac's signature, works out sessions from events, stores them in Postgres, and sends events to your SIEM (Splunk, Microsoft Sentinel or syslog) as OCSF or CEF over HTTPS or TLS. IT staff open the console in a browser, and sign in through Entra ID or Okta. If you connect Microsoft Intune, Altiward also reads the Macs it manages, read-only, through Microsoft Graph.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #111111; }
    .title { font-size: 15px; font-weight: 600; }
    .name { font-size: 14px; font-weight: 600; }
    .note { fill: #585858; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #585858; }
    .group { fill: #f3f3f3; }
    .box { fill: #ffffff; stroke: #808080; stroke-width: 1; }
    .outside { fill: #ffffff; stroke: #808080; stroke-width: 1; stroke-dasharray: 4 3; }
    .flow { fill: none; stroke: #111111; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
    <g id="mark">
      <rect x="0" y="12" width="18" height="4.5" fill="#1c1713"/>
      <rect x="6" y="6" width="12" height="4.5" fill="#1c1713"/>
      <rect x="12" y="0" width="6" height="4.5" fill="#ff8a1f"/>
    </g>
  </defs>
  <rect width="1000" height="460" fill="#ffffff"/>

  <!-- Each Mac -->
  <rect class="group" x="24" y="24" width="248" height="412" rx="10"/>
  <text class="title" x="40" y="48">Each Mac</text>
  <rect class="box" x="40" y="64" width="216" height="52" rx="8"/>
  <text class="name" x="56" y="86">SAP Privileges</text>
  <text class="note" x="56" y="105">grants admin rights</text>
  <path class="flow" d="M148 116 V146"/>
  <text class="mono" x="158" y="136">each change</text>
  <rect class="box" x="40" y="148" width="216" height="52" rx="8"/>
  <use href="#mark" x="56" y="158"/>
  <text class="name" x="82" y="170">Altiward hook</text>
  <text class="note" x="56" y="189">runs as the user: untrusted</text>
  <path class="flow" d="M148 200 V230"/>
  <text class="mono" x="158" y="220">XPC: its claim</text>
  <rect class="box" x="40" y="232" width="216" height="104" rx="8"/>
  <use href="#mark" x="56" y="246"/>
  <text class="name" x="82" y="258">Altiward agent</text>
  <text class="note" x="56" y="280">runs as root</text>
  <text class="note" x="56" y="299">checks each claim</text>
  <text class="note" x="56" y="318">queues events until sent</text>
  <path class="flow" d="M148 336 V366"/>
  <text class="mono" x="158" y="356">reads, removes</text>
  <rect class="box" x="40" y="368" width="216" height="52" rx="8"/>
  <text class="name" x="56" y="390">The admin group</text>
  <text class="note" x="56" y="409">who is really an admin</text>

  <!-- IT staff -->
  <rect class="box" x="392" y="24" width="304" height="64" rx="8"/>
  <text class="name" x="408" y="50">IT staff</text>
  <text class="note" x="408" y="70">the console, in a browser</text>

  <!-- Your server -->
  <rect class="group" x="392" y="120" width="304" height="316" rx="10"/>
  <text class="title" x="408" y="144">Your server</text>
  <path class="flow" d="M544 88 V158"/>
  <text class="mono" x="554" y="110">HTTPS 443</text>
  <rect class="box" x="408" y="160" width="272" height="140" rx="8"/>
  <use href="#mark" x="424" y="174"/>
  <text class="name" x="450" y="186">Altiward</text>
  <text class="note" x="424" y="208">API and web console, in Go</text>
  <text class="note" x="424" y="227">checks each Mac's signature</text>
  <text class="note" x="424" y="246">works out sessions from events</text>
  <text class="note" x="424" y="265">sends events to your SIEM</text>
  <text class="mono" x="424" y="287">altiward-api</text>
  <path class="flow" d="M544 300 V334"/>
  <rect class="box" x="408" y="336" width="272" height="84" rx="8"/>
  <text class="name" x="424" y="362">Postgres</text>
  <text class="note" x="424" y="382">events, sessions, devices</text>
  <text class="note" x="424" y="401">events waiting for your SIEM</text>

  <!-- Between the Mac and the server -->
  <path class="flow" d="M256 252 H406"/>
  <text class="mono" x="332" y="224" text-anchor="middle">HTTPS 443</text>
  <text class="mono" x="332" y="239" text-anchor="middle">signed events</text>
  <path class="flow" d="M408 284 H258"/>
  <text class="mono" x="332" y="304" text-anchor="middle">revoke commands</text>

  <!-- Out of the server -->
  <path class="flow" d="M680 176 H744 V56 H790"/>
  <path class="flow" d="M680 262 H790"/>
  <path class="flow" d="M680 290 H744 V404 H790"/>
  <text class="mono" x="744" y="230" text-anchor="middle">OCSF or CEF</text>
  <text class="mono" x="744" y="245" text-anchor="middle">HTTPS or TLS</text>

  <!-- Identity provider -->
  <rect class="outside" x="792" y="24" width="184" height="64" rx="8"/>
  <text class="name" x="808" y="50">Entra ID or Okta</text>
  <text class="note" x="808" y="70">single sign-on</text>

  <!-- Your SIEM -->
  <rect class="group" x="792" y="160" width="184" height="184" rx="10"/>
  <text class="title" x="808" y="184">Your SIEM</text>
  <rect class="box" x="808" y="200" width="152" height="36" rx="8"/>
  <text x="824" y="223">Splunk</text>
  <rect class="box" x="808" y="244" width="152" height="36" rx="8"/>
  <text x="824" y="267">Microsoft Sentinel</text>
  <rect class="box" x="808" y="288" width="152" height="36" rx="8"/>
  <text x="824" y="311">Syslog</text>

  <!-- Intune -->
  <rect class="outside" x="792" y="372" width="184" height="64" rx="8"/>
  <text class="name" x="808" y="398">Microsoft Intune</text>
  <text class="note" x="808" y="418">its Macs, read-only</text>
</svg>
